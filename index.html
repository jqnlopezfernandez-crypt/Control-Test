<style>
/* Layout: panel de control de máquina — una columna centrada, cabecera con chapa y franja de señalización, pantallas apiladas. Diseño de un solo tema (oscuro) por elección. */
:root{

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --stripe:repeating-linear-gradient(-45deg,var(--yellow) 0 11px,var(--ink) 11px 22px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--fg);font:15px/1.55 var(--f-body);

  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px);
  min-height:100%;
}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Cabecera */
.plate{margin-top:14px;border:2px solid var(--edge);background:linear-gradient(180deg,#3a3f45,#2a2e33);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 var(--ink);position:relative}
.plate .stripe{height:10px;background:var(--stripe);border-bottom:2px solid var(--ink)}

.brand{flex:1;min-width:0}

.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 1px var(--ink);vertical-align:middle;margin-left:6px}

.seg{display:flex;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.seg button{flex:1;border:0;border-right:2px solid var(--ink);background:var(--panel2);padding:10px 6px;min-height:46px;font:700 14px/1.05 var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}

/* Tarjeta de estudio */
.card{background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--ink)}
.card .head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 14px;background:var(--panel2);border-bottom:2px solid var(--ink);font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.06em;flex-wrap:wrap}
.card .head .st{font-weight:600}
.q{padding:16px 16px 14px;font:600 18px/1.4 var(--f-body);min-width:0}
.a{padding:16px;border-top:3px solid var(--yellow);background:var(--bg2);min-width:0}
.a .label{color:var(--yellow);display:block;margin-bottom:10px}
.txt{min-width:0;overflow-wrap:anywhere}
.txt .ln{margin:0 0 6px}
.txt .ln:last-child{margin-bottom:0}
.txt .gapline{height:8px}

.q .txt .ln:first-child{font-size:18px}
.q .txt .ln+.ln{font-weight:500;font-size:15.5px;color:#d4d8dc}
.tblw{overflow-x:auto;margin:6px 0 10px;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl td,.tbl th{border:1px solid var(--edge);padding:8px 10px;vertical-align:top;text-align:left;min-width:90px}

.fig{margin:8px 0 10px;background:#fff;padding:6px;border:2px solid var(--ink);max-width:100%}
.fig img{display:block;max-width:100%;height:auto;margin:0 auto}
sub{font-size:.72em}
.card{border-left:6px solid var(--tc,var(--edge))}

.hlbtn{border:1px solid var(--edge-hi);background:var(--ink);color:var(--muted);font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;min-height:32px}
.hlbtn[aria-pressed="true"]{color:var(--ink);background:var(--tc,var(--yellow));border-color:var(--ink)}

.spkbtn[aria-pressed="true"]{background:var(--tc,var(--yellow));color:var(--ink);border-color:var(--ink)}
.ahead{flex-wrap:wrap}
.nota{margin:0 16px 14px;padding:8px 10px;border-left:4px solid var(--mid);background:rgba(236,154,30,.08);font-size:12.5px;color:#e9c99a}

/* Huecos */
.gap{display:inline-block;min-width:3.2em;border:0;border-bottom:3px solid var(--yellow);background:rgba(246,193,15,.12);color:transparent;padding:0 4px;margin:0 1px;font:inherit;line-height:1.3;vertical-align:baseline;user-select:none}

.kpi.bad .v{color:var(--bad)}.kpi.mid .v{color:var(--mid)}.kpi.good .v{color:var(--good)}
.trow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--edge)}
.trow:first-of-type{border-top:0}
.trow .id{font:700 18px var(--f-disp);color:var(--tc,var(--yellow));letter-spacing:.04em}

.weak{display:flex;flex-direction:column;gap:6px}

/* Temario / guardado */
.vlist{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.vlist .r{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--edge)}

<script>
/* ============================================================
   TEMARIO ORIGINAL — Cuestiones Control de Calidad en laboratorio Analítico 2026/2027
   Transcripción literal del PDF. NO EDITAR el texto de q / a.
   Convenciones de maquetación (no alteran el texto):
   - "\n" separa líneas lógicas; los espacios iniciales indican sangría.
   - Líneas que empiezan por "|" son filas de tabla (celdas separadas por " | ");
     "|!" marca fila de encabezado. "¶" es un salto de línea dentro de una celda.
   - "[[img:clave]]" inserta la figura original del PDF.
   - "_{x}" se muestra como subíndice.
   ============================================================ */
const TEMAS = [
 {id:"T1", nombre:"TEMA 1 – CALIDAD Y QUÍMICA ANALÍTICA"},
 {id:"T2", nombre:"TEMA 2 – PRINCIPIOS BÁSICOS DE GARANTÍA DE LA CALIDAD"},
 {id:"T3", nombre:"TEMA 3 – BUENAS PRACTICAS DE LABORATORIO (BPL)"},
 {id:"T4", nombre:"TEMA 4 – PRINCIPIOS ESTADÍSTICOS PARA EL CONTROL DE CALIDAD (I)"},
 {id:"T5", nombre:"TEMA 5 – PRINCIPIOS ESTADÍSTICOS PARA EL CONTROL DE LA CALIDAD (II)"},
 {id:"T6", nombre:"TEMA 6 – MEDIDAS DE INCERTIDUMBRE"},
 {id:"T7", nombre:"TEMA 7 – MATERIALES DE REFERENCIA"},
 {id:"T8", nombre:"TEMA 8 – CALIBRACIÓN EN ANÁLISIS QUÍMICO"},
 {id:"T9", nombre:"TEMA 9 – DISEÑO Y SEGURIDAD DE LAS INSTALACIONES"},
 {id:"T10", nombre:"TEMA 10 - GESTIÓN DE EQUIPOS Y MATERIALES"},
 {id:"T11", nombre:"TEMA 11 - MUESTREO Y GESTIÓN DE MUESTRAS"}
];

const PREGUNTAS = [];
function P(tema, n, q, a, extra){ PREGUNTAS.push(Object.assign({id: tema+"-"+n, tema, n, q, a}, extra||{})); }

/* ---------------- TEMA 1 ---------------- */
P("T1",1,`1. ¿Qué se entiende por calidad?`,
`En términos generales, la calidad hace referencia a los atributos, características, propiedades o capacidad de una entidad. Se concibe como el compromiso de no tener deficiencias, hacer las cosas bien a la primera y satisfacer las necesidades del cliente.
Aplicada a un laboratorio analítico, la calidad se define como la competencia de un laboratorio para suministrar la información analítica que permite adoptar decisiones acertadas para resolver problemas planteados por la sociedad, la industria o un cliente en particular.`);

P("T1",2,`2. Definiciones de calidad según RAE e ISO y diferencia entre ellas.`,
`- RAE:
Propiedad o conjunto de propiedades inherentes a una cosa que permiten apreciarla como igual, mejor o peor que las restantes de su especie. En ediciones mas recientes (23.ª ed., 2014) se añade la adecuación de un producto o servicio a las características especificadas.
- ISO (Organización Internacional de Normalización):
    - ISO 8402 (1986): la totalidad de los rasgos y características de un producto, sistema o servicio que inciden en su capacidad de satisfacer necesidades reguladas o implícitas.
    - UE-EN ISO 9000 (2015): grado en el que un conjunto de características inherentes de un objeto cumple con los requisitos.
- Diferencias principales:
    - La definición de la RAE parte de una aproximación comparativa o basada en especificaciones fijas (evaluar si algo es mejor o peor respecto a su especie).
    - Las definiciones ISO responden a una aproximación aplicada orientada al cliente/usuario, enfocándose en la satisfacción de necesidades (explícitas o implícitas) y en el grado de cumplimiento de los requisitos exigidos.`);

P("T1",3,`3. ¿Cuáles son los beneficios que se obtienen al implantar un sistema de calidad?`,
`La implementación de un sistema de calidad en un laboratorio analítico aporta ventajas como:
    1. Prevención de errores en lugar de depender únicamente de la corrección posterior.
    2. Garantía y adecuación de la información analítica entregada para resolver de forma efectiva el problema analítico planteado por el cliente.
    3. Gestión global y competitividad: la calidad se integra en toda la organización como un factor estratégico decisivo para competir en el mercado.
    4. Optimización de recursos, permite reducir costos, tiempo, esfuerzos, materiales y riesgos en el laboratorio.`);

P("T1",4,`4. Complete el siguiente esquema y explique su significado:`,
`[[img:t1q4]]
Fines de la Química analítica: conectar la faceta básica de la disciplina (Calidad meteorológica Deseada) con su faceta aplicada (Resolución de problemas analíticos) teniendo como meta suprema la satisfacción de los requisitos informativos del paciente.
Objetivos de la Química analítica:
    - Mayorizantes (+) Buscan obtener más y mejor información (bio)química
    - Minorizantes (-): Buscan realizar el proceso consumiendo MENOS material, tiempo, esfuerzos, costes y riesgos.`,
{nota:"El esquema del documento aparece ya completado; se muestra como imagen al revelar la respuesta."});

P("T1",5,`5. ¿Cuáles son las propiedades analíticas supremas, básicas y complementarias y como están relacionadas con la calidad analítica?`,
`Las propiedades analíticas se organizan en tres niveles jerárquicos:
- Propiedades supremas: exactitud y representatividad.
Determinan de manera directa la calidad de los resultados (Información analítica).
- Propiedades básicas: sensibilidad, selectividad, precisión, robustez y muestreo. Son el soporte técnico esencial y determinan la calidad del proceso analítico.
- Propiedades complementarias: rapidez, economía (coste/beneficio) y factores personales (seguridad/comodidad). Representan la metacalidad del proceso analítico.
En relación con la calidad analítica para lograr la calidad en los resultados (propiedades supremas), es imprescindible asegurar la calidad del proceso analítico que los genera (propiedades básicas y optimizar los factores económicos, temporales y humanos (propiedades complementarias).`);

P("T1",6,`6. ¿Qué se entiende por trazabilidad de un resultado analítico? ¿Qué es necesario para conseguirla?`,
`La trazabilidad de un resultado analítico es la propiedad que implica su relación inequívoca con estándares o materiales de referencia apropiados a través de una cadena ininterrumpida de comparaciones, en las que la calibración juega un papel fundamental. Genéricamente es la capacidad de rastrear la historia, aplicación o localización de una entidad mediante registros identificados.
- Requisitos para conseguirla:
    1. Comparar las mediciones con estándares o patrones de medida de referencia bien establecidos.
    2. Disponer de una cadena ininterrumpida de calibraciones/comparaciones que conecte los equipos y datos de patrones primarios, nacionales o internaciones.
    3. Contar con un sistema de registro y adquisición de datos documentado que respalde los cálculos e identificaciones.`);

P("T1",7,`7. ¿Cuáles son los elementos básicos de la calidad?¿En qué consisten y cómo están relacionados entre ellos?`,
`1. Control de Calidad (Quality Control): actividades enfocadas a la satisfacción de los requisitos de calidad mediante el examen directo de la entidad utilizando indicadores cuantitativos.
2. Evaluación de la Calidad (Quality Assessment): actividades encaminadas a verificar que las tareas del control de calidad se realicen de forma adecuada y eficaz, examinando tanto la información analítica como el trabajo de laboratorio.
3. Garantía de Calidad (Quality Assurance): marco integrado y planificado de actividades diseñadas para asegurar que la información analítica genera alcance el nivel de calidad requerido.
- Relación entre ellos: El Control de Calidad ejecuta los ensayos y obtiene los datos cuantitativos, la Evaluación de la Calidad examina y audit la validez de dicho control y la Garantía de Calidad engloba a ambos, articulando las acciones preventivas y las actividades de corrección necesarias cuando se detectan desviaciones.`);

P("T1",8,`8. ¿Qué tipo de personal está involucrado en la calidad de los resultado analíticos?`,
`La calidad abarca a todo el personal relacionado directa o indirectamente con el laboratorio:
- Personal Interno:
    o Personal de laboratorio: directivos, especialistas, laborantes y personal de apoyo.
    o Gerentes/directores del organismo o empresa del que depende el laboratorio.
    o Evaluadores internos de la organización.
- Personal externo:
    o Usuarios/Clientes que solicitan los servicios analíticos.
    o Evaluadores externos (auditores de organismos de acreditación y certificación).`);

P("T1",9,`9. ¿Qué soportes básicos y complementarios requiere la implantación de un sistema de calidad en un laboratorio analítico?`,
`La implementación de un sistema de calidad en un laboratorio analítico requiere:
- Soportes básicos:
    o Material escrito: normativas, guías, documentación propia generada (procedimientos normalizados) y la bibliografía técnica.
    o Herramientas metrológicas: Patrones/estándares, métodos de ensayo validados y recursos estadísticos.
- Soportes complementarios:
    o Actividades básicas: Gestión de muestras, gestión y mantenimiento de quipos, validación de métodos y control interno de calidad.
    o Herramientas informáticas: programas y sistemas de información del laboratorio (LIMS).`);

P("T1",10,`10. ¿Qué son las normas UNE, EN y ISO?`,
`- Normas ISO (International Organization for Standardization): Normas de ámbito mundial elaboradas para armonizar criterios técnicos y de gestión a nivel internacional.
- Normas EN (European Norme): Normas europeas desarrolladas por el Comité Europeo de Normalización (CEN). Su adopción es obligatoria para los países miembros del CEN.
- Normas UNE (Una Norma Española): Normas nacionales españolas elaboradas y editadas por AENOR.
- Normas integradas (UNE-EN ISO): Cuando una norma ISO se adopta como europea pasa a ser EN ISO, y al ser transpuesta a la normativa española se designa como UNE-EN ISO (ej. UNE-EN ISO/IEC 17025)`);

P("T1",11,`11. ¿Qué organismos son los responsables de la elaboración revisión, aprobación y difusión de las normas anteriores?`,
`Los organismos responsables son los organismos de normalización, los cuales trabajan a través de comités técnicos formados por las partes interesadas:
- Nacional (España): AENOR (Asociación Española de Normalización y Certificación), entidad oficialmente reconocida para la normalización en España. A nivel internacional destacan otros como el NIST y ASTM (EE. UU.) o el BAM (Alemania).
- Europeo: CEN (Comité Europeo de Normalización), con sede en Bruselas.
- Mundial: ISO (Organización Internacional de Normalización)`);

P("T2",1,`1. ¿Qué es un sistema de calidad?`,
`Un sistema de calidad (Quality Management System) es una estructura organizativa concebida para establecer la política y los objetivos de la calidad, así como para articular los mecanismos y procesos necesarios para la consecución efectiva de dichos objetivos.
En el ámbito analítico, su finalidad primordial es asegurar que las determinaciones e informes producidos por el laboratorio posean un grado demostrado de fiabilidad, exactitud e integridad técnica. Este sistema forma parte del marco general de administración y gestión del laboratorio, integrando directrices regulatorias históricas (como la ley Clinical Laboratory Improvement Act de 1967, los reglamentos de la FDA de 1979 y los principios de la OCDE de 1998) con normas y guías técnicas internacionales (ISO, ASTM, EURACHEM/CITAC, IUPAC, AOAC, entre otras)`);

P("T2",2,`2. Toda organización debe establecer un sistema de calidad apropiado a:`,
`- Sus actividades (producción, distribución, servicios, etc.)
- Sus características (tamaño, ámbito territorial, etc.)
- Sus objetivos en materia de calidad.`);

P("T2",3,`3. ¿Qué se entiende por Buenas Prácticas de Medida? ¿Con qué siglas se conocen?`,
`Se conocen con las siglas GMPs (Good Measurement Practices).
Son el conjunto de procedimientos operativos y prácticos referidos a técnicas de medida concretas. Establecen las pautas técnicas detalladas para la ejecución correcta de las mediciones físico-químicas o instrumentales.
Las GMPs pueden formar parte o no de las Buenas Prácticas de Laboratorio (BPL o GLPs). Mientras que las GLPs constituyen las reglas oficiales y requerimientos organizativos mínimos destinados a promover la calidad e integridad global del producto de trabajo del laboratorio, las GMPs se concentran de manera específica en la ejecución metrológica y operativa de las mediciones analíticas.`);

P("T2",4,`4. ¿En qué consisten los Procedimientos Normalizados de Trabajo?`,
`Conocidos como PNT (o SOPs, Standard Operational Procedures), consisten en la descripción detallada de todas las operaciones del laboratorio, desde la entrada de las muestras hasta al adquisición y archivo de datos, incluyendo también los procesos administrativos de gestión.`);

P("T2",6,`6. ¿Cite qué tipo de personal participa en la implantación de un sistema de calidad e indique una tarea que desempeñen?`,

P("T2",7,`7. ¿Qué tipo de costes tiene la implantación de un sistema de calidad en un laboratorio? ¿Y de beneficios?`,
`1. Costes (tangibles):
    a. Costes de prevención: Requeridos para evitar que se generen datos inaceptables (ej. documentación adecuada, elaboración de especificaciones, capacitación del personal, calendarios de mantenimiento y calibración).
    b. Costes de evaluación: Necesarios para mantener los sistemas de medición bajo control estadístico (ej. control de calidad de equipos y métodos, inspecciones independientes y ensayos inter e intralaboratorios).
    c. Costes de corrección: Requeridos para corregir estados fuera de control o insatisfactorios (ej. investigación de problemas, reanálisis de muestras e implementación de medidas correctoras).
2. Beneficios (la mayoría intangibles):
    a. Mejora de la imagen pública y de la credibilidad del laboratorio.
    b. Disminución de las quejas de los clientes.
    c. Ahorro económico al evitar tener que repetir, corregir o descartar muestras y datos mal analizados.
    d. Cumplimiento de leyes/reglamentaciones y mejora del ánimo del personal`);

P("T2",8,`8. ¿Cómo deben ser los objetivos del Programa de Garantía de Calidad?`,
`Los objetivos de este programa deben reunir cinco condiciones fundamentales para ser operativos:
• Precisos: Formularse sin ambigüedades, especificando con exactitud qué se pretende alcanzar.
• Claramente establecidos: Estar formalmente documentados y comunicados en el sistema.
• Comprendidos por la administración y el personal: Tanto la directiva como los analistas de laboratorio deben asimilar su significado y requisitos para remar en la misma dirección.
• Relacionados con los resultados deseados: Guardar coherencia técnica y estar alineados con las expectativas de exactitud, precisión, trazabilidad y plazos del laboratorio.
• Servir como patrón para medir el éxito del programa: Actuar como estándar o indicador evaluable frente al cual comparar el desempeño real mediante auditorías internas y revisiones`);

P("T2",9,`9. Cite 5 de los objetivos más comunes de un Sistema de Garantía de Calidad.`,
`El temario recoge ocho objetivos específicos prioritarios comunes a todo laboratorio analítico:
1. Elevar la calidad general del desempeño del laboratorio.
2. Mantener una evaluación continua de los datos de calidad generados a lo largo del tiempo.
3. Identificar buenos métodos analíticos y detectar necesidades de investigación o desarrollo.
4. Proporcionar registros permanentes del funcionamiento de los instrumentos (hojas de vida, calibraciones y averías).
5. Asegurar la integridad de las muestras en todo su recorrido y cadena de custodia.
6. Mejorar el mantenimiento de los registros y archivos del laboratorio.
7. Producir resultados analíticos con validez demostrable frente a un escrutinio legal.
8. Detectar necesidades de capacitación y perfeccionamiento técnico del personal.`);

P("T2",10,`10. ¿Qué es el manual de garantía de calidad?`,
`Es el documento escrito que identifica las políticas y los objetivos de la institución, las actividades funcionales y las actividades específicas de calidad concebidas para alcanzar las metas deseadas. Describe de manera sistemática las medidas que empleará el laboratorio para ejecutar el programa de garantía de calidad.`);

P("T3",1,`1. ¿Qué significa GLP y BPL?`,
`- BPL: Buenas Prácticas de Laboratorio.
- GLP: Good Laboratory Practices (Término en inglés).`);

P("T3",2,`2. ¿A que dos organismos se debe el origen de las BPL?`,
`El origen y desarrollo normativo de las BPL se debe a:
- FDA (Food and Drugs Administration de EE.UU): A inicios de los años 60 detectó malas prácticas y discrepancias en datos analíticos recibidos de distintos laboratorios, lo que llevó a que en 1978 promulgara la primera reglamentación de BPL para medicamentos.
- OCDE (Organización para la Cooperación y el Desarrollo Económico): En 1978 puso en marcha un programa específico de control de productos químicos y en 1981 publicó formalmente los Principios de BPL para armonizar políticas y ensayos entre los países miembros.`);

P("T3",3,`3. ¿Para qué se empleaba la Talidomida y que efectos produjo?`,
`- La talidomida es un fármaco comercializado entre 1958 y 1963 indicando como sedante y calmante de las náuseas durante los primeros meses del embarazo.
- Efectos: Produjo graves efectos teratogénicos (malformaciones irreversibles en el feto), provocando que miles de niños nacieran en todo el mundo con focomelia. Se comercializo sin haber sido suficientemente estudiado y con ocultación de los efectos secundarios que iban detectando, convirtiéndose en el donante histórico de los controles de seguridad preclínicos.`);

P("T3",4,`4. ¿A qué tipo de ensayos se aplican las BPL?`,
`Se aplican a estudios toxicológicos y ensayos no clínicos (preclínicos) de seguridad sanitaria y medioambiental orientados a evaluar si una sustancia presenta actividad tóxica con posible impacto sobre el ser humano. Abarcan los estudios previos a la autorización o registro de nuevos productos, incluyendo la determinación de propiedades fisicoquímicas, estudios toxicológicos, ecotoxicológicos y ecológicos.`);

P("T3",5,`5. ¿A qué tipo de sustancias se aplican los principios de las BPL?`,
`Los principios de las BPL se aplican a ensayos no clínicos sobre sustancias químicas destinadas a:
- Medicamentos (tanto de medicina humana como veterinaria).
- Cosméticos.
- Aditivos.
- Productos fitosanitarios.
- Productos químicos industriales.`);

P("T3",6,`6. Cite y comente brevemente, tres diferencias entre BPL e ISO 17025.`,
`Carácter normativo y legal: Las BPL son de carácter reglamentario (obligatorio por ley) y sus infracciones pueden derivar en los tribunales ISO 17025 es una norma voluntaria.
Finalidad del estudio: Las BPL están concebidas para estudios únicos (desarrollo y registro de nuevas sustancias), mientras que la norma ISO 17025 está diseñada para estudios de rutina.
Uso de organismos vivos: Las BPL contemplan e incorporan ensayos con organismos vivos (animales y plantas), la norma ISO 17025 se aplica a ensayos analíticos sin organismos vivos.
Otras diferencias: las BPL exigen PNTs con formato y contenidos estrictamente regulados, archivo obligatorio hasta un año tras el cese de comercialización y responsabilidades individuales formalmente asignadas como el director del Estudio`);

P("T3",7,`7. ¿Qué persona es la responsable del archivo y registro en las BPL?`,
`LA persona designada como responsable del archivo y de la conservación de registros y materiales es el Jefe del programa de Garantía de Calidad.`);

P("T3",8,`8. ¿Qué entiende por el hecho de que las BPL constituyan “una filosofía de trabajo”?`,
`Significa que no solo son una técnica analítica,sino un modelo organizativo integral que fiscta como debe procederse sistemáticamente en cada fase del trabajo, desde el diseño incial dele studio hasta su archivo definitivo. Relga minuciosamente la planificación, ejecución, control, registro, conservación e informe de resultados apra asegurar la traza bilidad, calidad e integridad de los datos en todo momento.`,
{nota:"El original contiene varias erratas tipográficas (p. ej. «fiscta», «dele studio», «Relga», «apra», «traza bilidad»). Se conservan tal cual; revísalas en tu documento."});

P("T3",9,`9. Los 3 objetivos de la utilización de las BPL son:`,
`1. Reflejo Real: Asegurar que los datos informados en los reportes correspondan con absoluta fidelidad y exactitud a los resultados obtenidos durante el estudio experimental.
2. Asegurar la Honestidad: Evitar que los laboratorios incurran o participen en actividades fraudulentas o malas prácticas.
3. Aceptación Internacional: Promover el reconocimiento y la aceptación mutua de los ensayos y datos entre países (evitando la repetición innecesaria de experimentos con animales y eliminando barreras técnicas al comercio).`);

P("T3",10,`10. Conteste Verdadero (V) o Falso (F), y justifique o comente brevemente su respuesta a las siguientes afirmaciones:
«Las personas implicadas en el Programa de Garantía de Calidad deben formar parte del estudio toxicológico que se esté realizando»
«El propósito de las BPL es la protección de personas, animales y medioambiente».
«Las BPL deben incluir distintos Procedimientos Normalizados de Trabajo (PNTs)»
«La dirección del laboratorio debe ser la responsable de la realización global del estudio que se esté realizando»`,
`«Las personas implicadas en el Programa de Garantía de Calidad deben formar parte del estudio toxicológico que se esté realizando»
Falso (F). Para garantizar la objetividad, el personal del Programa de Aseguramiento de Calidad no debe formar parte del estudio; su función es independiente y consiste en supervisar, auditar y garantizar ante la dirección que se cumplan las BPL.
«El propósito de las BPL es la protección de personas, animales y medioambiente».
Verdadero (V). El fin último de las BPL es verificar la inocuidad y caracterizar el riesgo toxicológico de los productos químicos antes de su comercialización, salvaguardando la salud humana, la de los animales y la integridad ambiental.
«Las BPL deben incluir distintos Procedimientos Normalizados de Trabajo (PNTs)»
Verdadero (V). Es el principio 7 de las BPL; el laboratorio debe documentar por escrito y disponer de PNTs aprobados por la dirección que describan detalladamente la ejecución de cada tarea analítica u operativa, bajo la máxima de que «solo lo que está escrito existe».
«La dirección del laboratorio debe ser la responsable de la realización global del estudio que se esté realizando»
Falso (F).La responsabilidad de la realización global del estudio, así como la redacción y firma del informe final, recae en el Director del Estudio. La Dirección del laboratorio tiene la autoridad estructural y organizativa formal (nombrar al director, dotar recursos y aprobar el sistema de calidad), pero no dirige la ejecución del ensayo específico.`,
{nota:"Verdadero/Falso: las afirmaciones se muestran también en la pregunta para poder responder sin ver la solución."});

P("T4",3,`3. ¿Qué información se obtiene de un histograma?`,
`• Visualización de la dispersión y distribución: Muestra la variabilidad y el modelo de distribución de los valores observados.
• Comportamiento del proceso: Permite comunicar de forma visual cómo opera el proceso en un periodo determinado.

P("T4",4,`4. ¿Qué establece el principio de Pareto? Explíquelo con un ejemplo.`,
`El principio de Pareto establece que sólo unas pocas causas originan habitualmente la mayoría del efecto (principio del 80/20, que separa los "pocos vitales" de los "muchos triviales").
• Ejemplo:
    o Ventas y clientes: El 20% de los clientes ("pocos vitales") genera el 70%-80% de las ventas ("efecto total"), mientras que el 80% restante de clientes representa únicamente el 20%-30% de las ventas.
    o Averías en servicios: En un análisis de averías telefónicas, únicamente dos tipos de defectos (líneas ruidosas y abiertas) representan el 72% del total de informes de fallo.`);

P("T4",5,`5. ¿Qué información se obtiene de un diagrama de Pareto?`,
`• Una visualización en orden decreciente de importancia de la contribución relativa de cada elemento al efecto total.
• La clasificación de las oportunidades de mejora, distinguiendo de forma clara los problemas principales sobre los cuales enfocar los recursos para optimizar la mejora con un esfuerzo mínimo.`);

P("T4",6,`6. ¿Qué elementos se utilizan en la construcción de un diagrama de Pareto y qué representa cada uno?`,
`• Eje horizontal (X): Representa las distintas categorías, tipos de defectos o causas analizadas, ordenadas de mayor a menor frecuencia o impacto.
• Eje vertical izquierdo: Muestra la frecuencia absoluta, número de ocurrencias o coste asociado a cada categoría.
• Eje vertical derecho: Muestra la escala de porcentaje o contribución relativa acumulada (de 0% a 100%).
• Bloques o barras: Representan la contribución individual o peso relativo de cada elemento al efecto global.
• Línea de frecuencias acumuladas (Curva de Pareto): Traza el porcentaje acumulado del efecto producido por las distintas causas conforme se suman ordenadamente.`);

P("T5",1,`1. ¿Cuáles son los métodos que se utilizan para describir un grupo de datos?`,
`Los métodos más utilizados para describir un grupo de datos son las medidas de tendencia central y las medidas de dispersión. Además, se emplean las medidas de forma para conocer la geometría de la distribución`);

P("T5",2,`2. ¿Qué son las medidas de tendencia central? Cite dos ejemplos`,
`Una medida de tendencia central es un valor numérico que describe la ubicación central de los datos o el grado en que estos tienden a agruparse en el centro.
    • Ejemplos: La media (o promedio) y la mediana (o la moda)`);

P("T5",3,`3. ¿Qué son las medidas de dispersión? Cite dos ejemplos`,

P("T6",1,`1. Relacione los conceptos error y desviación.`,
`Error: Es la diferencia que existe entre el valor real (µ) de una magnitud y el valor obtenido en una medida experimental de la misma (xi). Requiere disponer de una valor aceptado como verdadero para poder comparar.
Desviación: diferencia entre valor promedio (x) de una serie de medidas y el de una cualquiera de ellas (xi).
Si se acepta, mediante el cálculo de probabilidades que el valor real de una magnitud equivale al promedio de una serie de medidas de la misma (µ » x), entonces el error es igual a la desviación. Si no se asume esta aproximación, nunca se podrá conocer el valor real.`);

P("T6",2,`2. Errores sistemáticos instrumentales: origen, corrección y cite un ejemplo.`,
`Origen: Proceden del propio instrumento de medida.
Corrección: Se corrigen mediante la calibración periódica y un buen mantenimiento del equipo.
Ejemplo: Un pH-metro mal calibrado, el desajuste del cero o la contaminación del equipo (así como una balanza descalibrada que mida de manera constante con defecto de masa).`);

P("T6",3,`3. Responda Verdadero (V) o Falso (F) a las siguientes afirmaciones y justifique brevemente:
    a) «Los errores aleatorios no pueden eliminarse, ni reducirse, ni evaluarse»
    b) «El valor de la incertidumbre es siempre menor que el del sesgo»
    c) «La repetibilidad evalúa los errores sistemáticos»`,
`a) «Los errores aleatorios no pueden eliminarse, ni reducirse, ni evaluarse»
    Falso (F). Aunque es cierto que los errores aleatorios no pueden eliminarse, sí pueden reducirse y pueden evaluarse midiendo su magnitud mediante el análisis estadístico y la distribución gaussiana
b) «El valor de la incertidumbre es siempre menor que el del sesgo»
    Falso (F). La incertidumbre no es menor que el sesgo; al contrario, la incertidumbre engloba tanto los errores aleatorios como la parte no controlada de los errores sistemáticos (el sesgo).
c) «La repetibilidad evalúa los errores sistemáticos»
    Falso (F). Las réplicas en condiciones de repetibilidad (medidas sucesivas por el mismo analista y en condiciones idénticas) ponen de manifiesto y evalúan los errores aleatorios, los cuales afectan a la precisión. Los errores sistemáticos desplazan de forma reproducible la media y afectan a la veracidad, por lo que no se detectan mediante repetición en las mismas condiciones`,
{nota:"Verdadero/Falso: las afirmaciones se muestran también en la pregunta para poder responder sin ver la solución."});

P("T6",5,`5. ¿Cómo definiría la incertidumbre? y ¿Cómo se calcula la incertidumbre del método o proceso en el procedimiento global “black-box”?`,
`a) Incertidumbre: Parámetro asociado al resultado de una medición que caracteriza el intervalo de valores dentro del cual se sitúa con un gran probabilidad, el valor real de la magnitud que se mide. Cuantifica la dispersión o la duda que se tiene sobre el resultado experimental y engloba tanto los errores aleatorios como la parte no controlada de los errores sistemáticos o sesgo.
b) Calculo en el procedimiento global “black-box”: el proceso analítico se contempla metrológicamente como un todo en el que no se distinguen etapas individuales. La incertidumbre no se desglosa paso a paso, sino que se estima de forma global a partir de los datos de validación de la trazabilidad y la precisión del método utilizando Materiales de Referencia Certificados (MRC).
    1. Cálculo de la incertidumbre del método o proceso (U_{método} o U_{proceso})
    Tipo de evaluación: Es una evaluación de Tipo A.
    Procedimiento: El laboratorio analiza una serie de réplicas “n” de un MRC aplicando el método analítico completo.
    Fórmula: Se calcula directamente a partir de la desviación estándar de dichas réplicas S_{I} : u_{método}= S_{I} ; U_{método} = k x S_{I} (donde k es el factor de cobertura, habitualmente k = 2).
    2. Comprobación de la trazabilidad:
    Previa validación de la incertidumbre del proceso, verificamos experimentalmente que no exista un sesgo inaceptable mediante el análisis de t-Student con el MRC:
[[img:t6f1]]
    3. Integración en la incertidumbre total final (U):
    Una vez calculada, la incertidumbre del método se combina cuadráticamente con la del patrón y la de la muestra:
[[img:t6f2]]`,
{nota:"Las fórmulas (t_cal y U) y la lista de términos U_MRC, U_método y U_muestra están como imágenes en el PDF: se muestran como imagen y no entran en el modo de huecos."});

P("T7",1,`1. Responda Verdadero (V) o Falso (F) a las siguientes afirmaciones y justifique brevemente su respuesta:
“Los MRC se deben usar de forma rutinaria en el laboratorio”.
“Los materiales de referencia interno son patrones secundarios”.
“Un requisito básico en un MRC es que estén certificados el valor de todos sus componentes”.
“El MRC –Matriz debe tener una matriz natural”.
“Los Materiales contrastados permiten calibrar un instrumento”.`,
`“Los MRC se deben usar de forma rutinaria en el laboratorio”.
Falso (F). Son materiales de alta calidad, costosos y no siempre disponibles. Por ello, no deben utilizarse de forma rutinaria, sino que su empleo se restringe a situaciones clave y decisivas como la calibración de equipos, la validación de métodos analíticos, la comprobación de equivalencia entre métodos o la demostración de la trazabilidad.
“Los materiales de referencia interno son patrones secundarios”.
Verdadero (V). Dentro de la jerarquía de patrones analíticos, los materiales de referencia internos (MRI) se clasifican como patrones secundarios, ya que sus magnitudes son avaladas internamente para uso exclusivo del propio laboratorio y presentan pureza o estabilidad más limitadas, debiendo contrastarse frente a patrones primarios.
“Un requisito básico en un MRC es que estén certificados el valor de todos sus componentes”.
Falso (F). No se exige certificar la totalidad de los componentes de un material; por ejemplo, en los MRC-Matriz únicamente se certifican determinados analitos o componentes de interés en matrices concretas semejantes a las muestras reales. Asimismo, los requisitos básicos e imprescindibles de un MRC son la homogeneidad, la estabilidad, la exactitud y la trazabilidad.
“El MRC –Matriz debe tener una matriz natural”.
Falso (F). Los MRC-Matriz no se limitan exclusivamente a matrices naturales; pueden poseer matrices totalmente naturales, totalmente artificiales o mezclas (incluso sintéticas formuladas para emular matrices reales).
“Los Materiales contrastados permiten calibrar un instrumento”.
Falso (F). Los materiales contrastados son disoluciones valorantes empleadas como patrones secundarios en análisis químico volumétrico clásico. Para la calibración de instrumentos y equipos se requiere el uso de patrones primarios o materiales de referencia certificados (MRC).`,
{nota:"Verdadero/Falso: las afirmaciones se muestran también en la pregunta para poder responder sin ver la solución."});

P("T7",2,`2. ¿Cuáles son los requisitos para la selección de un MRC?`,
`Para elegir adecuadamente un Material de Referencia Certificado, se deben cumplir tres criterios fundamentales:
1. Similitud de la matriz: La matriz del MRC debe ser lo más parecida posible a las muestras reales que se van a analizar.
2. Similitud en los niveles de concentración: Debe existir concordancia entre las concentraciones de los analitos presentes en el MRC y las concentraciones esperadas en la muestra de análisis.
3. Baja incertidumbre: Los valores certificados del material deben presentar la menor incertidumbre posible.`);

P("T8",1,`1.- ¿Qué se entiende por calibración? ¿Cuál es el objetivo de la calibración?`,
`• Concepto de calibración: Es el conjunto de operaciones que establecen, en condiciones especificadas, la relación existente entre los valores de una magnitud indicados por un instrumento o sistema de medida (o los valores representados por una medida materializada o un material de referencia) y los valores correspondientes realizados mediante patrones.
• Objetivo: Su propósito principal es evaluar la capacidad de medida de los instrumentos y garantizar la comparabilidad de los resultados analíticos`);

P("T8",2,`2.- ¿En qué consiste la calibración instrumental? ¿Y la calibración metodológica?`,
`• Calibración instrumental: Se centra en comprobar y corregir el funcionamiento correcto del equipo o aparato empleado para la cuantificación (como balanzas, buretas o espectrofotómetros). Para ello, utiliza patrones que no contienen el analito objeto de análisis.
• Calibración metodológica: Su meta es establecer una relación clara e inequívoca entre la respuesta instrumental (señal) y la cantidad o concentración del analito en el método analítico. Se realiza empleando patrones que sí contienen el analito (salvo en los métodos estequiométricos)`);

P("T8",3,`3.- ¿Cómo se clasifican los métodos analíticos según el tipo de calibración? Ponga un ejemplo de cada uno.`,
`• Métodos estequiométricos: La calibración de un reactivo permite relacionar la cantidad de patrón con la cantidad de analito mediante un mecanismo químico, utilizando patrones químico-analíticos que no contienen al analito. Ejemplo: Volumetrías.
• Métodos absolutos: La medida física se relaciona directamente con la cantidad de materia utilizando patrones básicos. Ejemplo: Métodos gravimétricos.
• Métodos comparativos: Los valores obtenidos para los patrones y las muestras en idénticas condiciones experimentales se relacionan a través de una función o factor de calibración, utilizando patrones que contienen el analito y requiriendo calibración metodológica. Ejemplo: Métodos instrumentales`);

P("T8",4,`4.- ¿Por qué son importantes los patrones en un laboratorio analítico?`,
`Son un pilar fundamental porque actúan como material de referencia para calibrar los equipos de medida o contrastar los resultados; sin su uso sería imposible medir ni comparar determinaciones analíticas`);

P("T8",5,`5.- ¿Qué es un patrón? ¿Qué 3 tipos de patrones hay?`,
`Es un material empleado como referencia para calibrar equipos de medida o contrastar mediciones.
Los 3 tipos de patrones son:
    1. Patrones básicos: Coinciden con las unidades fundamentales del Sistema Internacional (SI), como el kilogramo, mol o amperio.
    2. Patrones químicos: Sirven como vínculo entre los estándares básicos y los químico-analíticos (por ejemplo, el Número de Avogadro o los pesos atómicos).
    3. Patrones químico-analíticos: Son los utilizados en la práctica analítica habitual y se clasifican en primarios y secundarios`);

P("T8",6,`6.- Complete el siguiente esquema y explique brevemente su significado.
[[img:t8q6]]`,
`Esquema piramidal de jerarquía metrológica (de arriba hacia abajo):
    - Cúspide: Estándares / Patrones Básicos (S.I.).
    - Nivel intermedio: Estándares / Patrones Químicos.
    - Base: Estándares / Patrones Analíticos (subdivididos en Primarios y Secundarios).
El esquema ilustra la escala metrológica de los estándares. A medida que se desciende hacia la base (patrones analíticos de rutina), aumenta la tangibilidad y la asequibilidad de los materiales, pero también se incrementa su incertidumbre. Por el contrario, hacia la cúspide disminuye la incertidumbre y aumenta la cercanía al valor considerado verdadero.`,

P("T8",7,`7.- ¿Qué diferencia hay entre un patrón primario y un patrón secundario?`,
`- Patrón primario: Es un material de alta pureza (impurezas <0,02%), homogeneidad y estabilidad, con una composición perfectamente definida. Permite preparar soluciones de concentración exacta mediante pesada directa.
- Patrón secundario: Posee una composición no bien definida o una pureza/estabilidad limitada, por lo que no puede prepararse por pesada directa y debe ser valorado o contrastado frente a un patrón primario de jerarquía superior.`);

P("T8",10,`10.- Indicar en estos gráficos:

3.- cómo se determina matemáticamente la concentración del analito (Cx); 4.- eje de abscisas

    2. Determinación gráfica de Cx: Se obtiene por interpolación del cociente de señales (Sx / S1) en la recta de calibrado.
    3. Determinación matemática de Cx: Se calcula dividiendo la señal del analito entre la del patrón interno (Sx / S1) y despejando la concentración x de la recta de regresión y = mx + b.

    3. Determinación matemática de $C_x$: Se obtiene despejando Cx= b/a (o b/m) a partir de la recta S = k(Cs + Cx) = a X + b, al igualar la señal a cero (X = -b / a = -Cx).

P("T9",1,`1.- ¿A qué debe responder el diseño de un laboratorio? Cite 5 elementos a considerar en ese diseño.`,
`El diseño de un laboratorio debe responder a alas necesidad específicas del mismo donde deben predominar la seguridad, la funcionalidad y la eficacia por encima de criterios puramente estéticos. Además las instalaciones deben permitir que las actividades se desarrollen de modo eficaz y seguro.
Elementos:
    1. Suelos, paredes y tabiques (materiales de construcción ignífugos, resistentes a agentes físicoquímicos y de fácil limpieza).
    2. Puestos de trabajo y ergonomía de las instalaciones.
    3. Iluminación.
    4. Puertas y distribución de dependencias que faciliten la evacuación.
    5. Sistemas de ventilación, extinción de incendios, alarmas y alumbrado de emergencia.`);

P("T9",2,`2.- El local de un laboratorio debe contar con las siguientes zonas:`,
`1. Zona de recepción y almacenamiento de muestras: Cuenta con un sistema informatizado de identificación y registro, así como almacenamiento protegido (luz, humedad, temperatura, congelación/refrigeración).
2. Zona de análisis: Distribuida según el tipo de muestras y técnicas analíticas, incluyendo área de tratamiento de muestras, sala de instrumentos (como balanzas) e instalaciones específicas para muestras peligrosas o determinación de trazas.
3. Zona de almacenamiento de material, productos químicos y residuos: Diseñada para mantener el stock al mínimo, con criterios de seguridad, aislamiento de productos muy peligrosos, buena ventilación y separación del resto del laboratorio.
4. Otras zonas: Despachos de dirección y administración, archivos, biblioteca y salas de reuniones.`);

P("T9",3,`3.- Justifique por qué es necesario controlar las siguientes condiciones ambientales:`,
`- Temperatura: Es necesario evitar temperaturas extremas y cambios bruscos ya que pueden alterar el correcto funcionamiento de los equipos analíticos.
- Humedad: Es perjudicial para la mayoría de la instrumentación analítica debido a que, combinada con otros vapores, acelera la corrosión y el deterioro de los instrumentos.
- Vibraciones: Pueden afectar negativamente a la estabilidad de algunas medidas (como las pesadas de precisión) y provocar averías mecánicas o electrónicas en los equipos
- Presencia de partículas: Las partículas en suspensión se introducen en las muestras y disoluciones alterando los resultados por contaminación, lo cual es crítico en la determinación de trazas`);

P("T9",5,`5.- ¿Qué es un material peligroso? Cite 4 tipos`,
`Un material peligroso es toda sustancia sólida, líquida o gaseosa que, fuera de su recipiente de contención, puede ocasionar daños a la vida, al medio ambiente y a los bienes.
Cuatro tipos de materiales peligrosos son:
1. Explosivos (o gases a presión).
2. Inflamables (fácilmente o extremadamente inflamables).
3. Comburentes.
4. Corrosivos. (Otros tipos citables: Tóxicos/Toxicidad aguda, Nocivos/Irritantes, Peligrosos para el medio ambiente).`);

P("T9",6,`6.- ¿Qué significan los siguientes pictogramas?
[[img:t9q6]]`,
`1. Sustancia inflamable (peligro de incendio).
2. Sustancia comburente (puede provocar o agravar un incendio o explosión).
3. Sustancia corrosiva (destruye tejidos vivos y ataca materiales).
4. Sustancia con toxicidad aguda / tóxica (puede causar efectos graves o la muerte al ser absorbida, ingerida o inhalada).
5. Sustancia peligrosa para el medio ambiente (provoca daños en los ecosistemas y fauna acuática)`,
{nota:"Pregunta con figura: pictogramas originales incluidos en la pregunta (numerados de izquierda a derecha)."});

P("T9",7,`7.- ¿Qué indican las frases H? ¿Y las frases P?`,
`- Frases H (Hazard statements / Indicaciones de peligro): Son frases que describen la naturaleza de los peligros asociados a una sustancia o mezcla química (sustituyen a las antiguas frases R). Ejemplo: H311 (Tóxico en contacto con la piel).
- Frases P (Precautionary statements / Consejos de prudencia): Son frases que describen las medidas recomendadas para evitar o minimizar los efectos adversos de dichos peligros (sustituyen a las antiguas frases S). Ejemplo: P402 (Almacenar en un lugar seco).`);

P("T9",8,`8.- ¿Qué es un residuo peligroso y qué gestión adecuada requiere?`,
`Cualquier sustancia o producto que, en función de sus características (tóxico, irritante, inflamable, biológico, radiactivo, etc.), constituye un factor de riesgo para la salud o el medio ambiente, y del cual es obligatorio desprenderse.
Una gestión adecuada requiere un procedimiento especial de control, tratamiento y eliminación. Deben conservarse en recipientes apropiados, debidamente tapados y etiquetados, encargando su recogida y neutralización final a empresas especializadas autorizadas`);

P("T9",9,`9.- Complete la siguiente tabla indicando cómo se lleva a cabo la eliminación de los siguientes residuos:`,
`|! Residuos no peligrosos | Residuos peligrosos
| Pueden eliminarse directamente mediante vertido a las aguas residuales (alcantarillado) o basura común | Requieren procedimientos especiales a través de empresas especializadas: ¶ •Combustibles: Incineración. ¶ •No combustibles: Tratamiento previo adecuado y vertido controlado. ¶ •Biológicos: Esterilización e incineración. ¶ •Radiactivos: Gestión regulada por el CSN.`);

P("T9",10,`10.- Los procedimientos más utilizados para la eliminación de residuos son:`,
`Los cuatro procedimientos más utilizados son:
    1. Vertido.
    2. Incineración.
    3. Recuperación.
    4. Reutilización - Reciclado.
Su elección depende de factores como: el volumen de residuo generado, la periodicidad, la facilidad de neutralización, la posibilidad de recuperación, reciclado o reutilización, el coste y el tiempo.`);

/* ---------------- TEMA 10 ---------------- */
P("T10",1,`1. Diferencia entre:
a) Aparato e Instrumento.
b) Mantenimiento preventivo y correctivo.
c) Reactivo y Disolvente.`,
`a) Aparato e Instrumento.
Un aparato es un equipo sin capacidad de medida destinado a cumplir funciones auxiliares en el laboratorio como calentar o agitar (p. ej., un baño termostatizado), mientras que un instrumento es un equipo destinado a realizar mediciones y generar información analítica (p. ej., una balanza o un pHmetro).
b) Mantenimiento preventivo y correctivo.
El mantenimiento preventivo consiste en actuaciones planificadas por el personal del laboratorio o el servicio técnico para garantizar el buen funcionamiento del equipo y evitar averías, mientras que el mantenimiento correctivo engloba las reparaciones que realiza el servicio técnico para solucionar averías y fallos ya producidos.
c) Reactivo y Disolvente.
Un reactivo es la sustancia química con la que se llevan a cabo las reacciones o se fija el medio analítico, mientras que un disolvente es el medio líquido (como agua o disolventes orgánicos) en el que se produce dicha reacción o que se utiliza para preparar las disoluciones.`,
{nota:"Los apartados a), b) y c) se muestran también en la pregunta."});

P("T10",2,`2. Cite, y comente brevemente, dos características básicas y dos complementarias que hay que tener en cuenta en la selección de un equipo.`,
`- Características básicas:
    o Sensibilidad: Capacidad del equipo para detectar y responder ante pequeñas variaciones o cantidades del analito.
    o Resolución: Menor diferencia de magnitud que el equipo es capaz de distinguir y mostrar en su escala o lectura.
- Características complementarias (elegir dos):
    o Coste: Presupuesto e inversión económica requerida para la compra y mantenimiento del equipo.
    o Servicio técnico, repuestos y garantía: Disponibilidad de asistencia técnica oficial, suministro ágil de piezas de recambio y cobertura frente a fallos.`);

P("T10",3,`3. ¿Por qué es necesario realizar un mantenimiento preventivo del equipo de medida?, ¿quién lo realiza?.`,
`El mantenimiento preventivo es necesario porque nos permite asegurar el funcionamiento correcto del equipo y evitar averías. Además, reduce defectos operativos, facilita ajustes oportunos, minimiza daños, incrementa la confianza en el sistema de medición y reduce tanto la variabilidad en los resultados como los gastos derivados de reparaciones mayores.
Este es realizado por el personal del laboratorio o el personal del servicio técnico.`);

P("T10",4,`4. En qué se diferencia una balanza analítica de una microbalanza.`,
`Una balanza analítica mide habitualmente con una resolución de cuatro o cinco cifras decimales (de 0,1 mg a 0,01 mg) para pesar muestras y patrones, mientras que una microbalanza alcanza una sensibilidad muy superior (de hasta 0,1 µg) y se reserva para microanálisis que requieren una precisión extrema.`);

P("T10",5,`5. ¿Qué ingredientes contiene la mezcla crómica?.`,
`La mezcla crómica para limpieza contiene:
• 400 mL H2SO4 (ácido sulfúrico concentrado).
• 20 g de K3CrO7.
• 15 mL de agua destilada`);

P("T10",6,`6. ¿Cómo y cuándo se debe controlar el grado de pureza del agua usada en un laboratorio analítico?.`,
`El grado de pureza debe controlarse periódicamente mediante las siguientes determinaciones:
• Medida de la conductividad: Control diario.
• Determinación de metales pesados: Control mensual.
• Determinación de materia orgánica: Control mensual.
(En los sistemas modernos de purificación de agua, estos parámetros se monitorizan de forma continua)`);

P("T10",7,`7. ¿Qué significa que un reactivo tenga calidad HPLC? ¿y USP?.`,
`- Un reactivo con calidad HPLC es un reactivo de pureza especial diseñado y verificado específicamente para su empleo en Cromatografía Líquida de Alta Resolución (High Performance Liquid Chromatography).
- Un reactivo con calidad USP es un producto químico que cumple las especificaciones y normativas oficiales de calidad de la Farmacopea de estados Unidos.`);

P("T10",8,`8. Indique las normas de calidad en el uso de reactivos.`,
`- La disolución de un reactivo no debe utilizarse transcurridos 6 meses, aun cuando se considere estable.
- Nunca devolver el exceso de disolución al frasco original.
- El recipiente solo debe abrirse para retirar la porción necesaria y debe cerrarse rápidamente.
- Nunca dejar pipetas o espátulas en el interior del recipiente.
- Conservar los productos siguiendo siempre las instrucciones del fabricante.
- Mantener los reactivos en recipientes adecuados y correctamente etiquetados (nombre, concentración, lote/fechas de preparación y caducidad, responsable y advertencias de peligro).`);

P("T10",9,`9. Explique el fundamento de la prueba del permanganato utilizada para comprobarla calidad del agua.`,
`La prueba del permanganato para comprobar la calidad de agua se utiliza con la finalidad de evaluar la presencia de materia orgánica en el agua purificada.
El fundamento químico se basa en la capacidad oxidante del permanganato (MnO4-) de color rosa intenso, cuando existen compuestos oxidables en el agua el permanganato se reduce a ion manganeso (Mn2+) que es incoloro.
El procedimiento consiste en añadir 0,03 mL de KMnO4 0,1M a una mezcla de 500mL de agua de muestra 1 mL de H2SO4, para que el agua cumpla los requisitos de calidad analítica de la ACS el color rosa debe persistir durante al menos 1 hora a temperatura ambiente.`);

P("T10",10,`10. Explique brevemente como se puede evaluar globalmente la contaminación del agua por sustancias inorgánicas.`,
`Se evalúa mediante conductividad eléctrica (μS/cm), esta medida es directamente proporcional al número total de iones en disolución.
De acuerdo con la norma ASTM, menores valores de conductividad indican mayor pureza y menor contenido inorgánico disuelto (desde el agua de red con cerca de 240 μS/cm, pasando por:
Tipo III con 5 μS/cm.
Tipo II con 1 μS/cm.
Tipo I con 0,06 μS/cm.
Hasta el agua ultrapura con <0,06 μS/cm)`);

/* ---------------- TEMA 11 ---------------- */
P("T11",1,`1. ¿Qué es entiende por muestreo primario y qué tipos de muestras incluye?`,
`El muestreo primario comprende el conjunto de operaciones de toma de muestra llevadas a cabo fuera del laboratorio directamente sobre el objeto o lote de estudio.
Según las definiciones recomendadas por la IUPAC, incluye los siguientes tipos de muestras según su tamaño y proximidad al objeto:
- Incremento: Porción de material obtenida en una operación individual de toma de muestra.
- Muestra primaria: Conjunto formado por uno o varios incrementos.
- Muestra compuesta: Cantidad total obtenida al combinar y homogeneizar varios incrementos.
- Submuestras: Fracciones resultantes de procesos intermedios de reducción física practicados antes del envasado y envío.`);

P("T11",2,`2. Indique, y comente brevemente, dos dificultades asociadas al muestreo.`,
`a) Heterogeneidad del material (intrínseca): La distribución no uniforme de los componentes a lo largo del lote y la gran disparidad de tamaño entre la masa total del lote y la porción analítica final dificultan la representatividad.
b) Operación fuera del control del laboratorio (de gestión / calidad): Al ser comúnmente una operación off-line, suele quedar fuera de la supervisión directa del personal de laboratorio, recayendo con frecuencia en operarios con cualificación insuficiente y sin medios suficientes de control. Por ello, se considera el eslabón más débil de toda la cadena analítica, bajo el principio de que los resultados solo dan fe de la muestra recibida.`);

P("T11",3,`3. ¿Qué se entiende por error de muestreo? ¿Cuáles son las fuentes de error? Coméntelas brevemente.`,
`El error de muestreo es la discrepancia inevitable entre la muestra y la población, fundamentado en que la composición de la mejor muestra que se pueda obtener será siempre distinta de la composición del lote. Presenta la característica crítica de que no puede ser evaluado ni controlado mediante estándares o materiales de referencia, y su varianza se añade a la varianza total del proceso analítico.
Sus principales fuentes de error se dividen en:
- Planificación y metodología deficientes: Falta de fundamento estadístico en el plan, delimitación inadecuada del lote u operaciones de muestreo incorrectas.
- Fallos operativos y humanos: Homogeneización insuficiente, documentación escasa, manipulación indebida de instrumentos y personal no cualificado.
- Alteraciones físicas: Adsorción o interacción con las paredes del envase, sedimentación, precipitación, evaporación de componentes volátiles, segregación de sólidos o pérdidas/ganancias de humedad.
- Alteraciones químicas y biológicas: Reacciones de hidrólisis, oxidación, fotodegradación, fermentación o proliferación microbiológica.
- Contaminación e identificación errónea: Contaminación por el ambiente, el operario, utensilios o preservantes, así como fallos en el etiquetado.`);

P("T11",4,`4. ¿Por qué es conveniente secar la muestra antes de su análisis?`,
`El secado es una operación de pretratamiento indispensable para:
1. Referir los resultados analíticos a materia seca, proporcionando una base cuantitativa constante e independiente de las fluctuaciones de humedad ambiental.
2. Retrasar fenómenos de alteración, principalmente reacciones de hidrólisis y degradaciones enzimáticas o microbiológicas favorecidas por el agua. Debe realizarse controlando las pérdidas de analitos volátiles o termolábiles (mediante estufa o liofilización).`);

P("T11",5,`5. ¿Por qué hay que disolver la muestra en la mayoría de los análisis?`,
`Es imprescindible disolver la muestra porque la gran mayoría de las técnicas analíticas e instrumentos de medida requieren que la muestra se encuentre en disolución. La disolución permite transformar el analito en una especie química homogénea y fácilmente medible.`);

P("T11",6,`6. ¿Por qué a veces es necesario separar el analito antes de su determinación?`,
`Dentro de la fase de tratamiento químico de la muestra, las separaciones se realizan por tres motivos principales:
1. Extraer el analito de matrices complejas.
2. Eliminar interferencias ocasionadas por otros componentes de la matriz que alteren la señal analítica.
3. Preconcentrar el analito cuando su concentración en la muestra es inferior a los límites de detección o cuantificación de la técnica empleada.`);

P("T11",7,`7. ¿Qué se entiende por “holding time”? ¿Qué importancia tiene su determinación?`,
`El Holding Time (HT) es el máximo periodo de tiempo que puede transcurrir desde el momento del muestreo hasta el análisis antes de que la muestra haya sufrido cambios significativos en su composición.
Su determinación es crítica porque establece el límite temporal válido para la conservación, almacenamiento y transporte, garantizando que no existan modificaciones cualitativas o cuantitativas en los analitos y asegurando la exactitud y validez de los resultados`);

P("T11",8,`8. ¿Qué factores hay que considerar en el transporte y conservación de la muestra?`,
`Durante el transporte y conservación se deben controlar rigurosamente los siguientes factores:
- Identificación y etiquetado: Etiquetado inequívoco (mediante código de barras) que detalle el nombre del material, lugar, datos cronológicos (fecha/hora), técnica empleada, precauciones de seguridad y responsable.
- Control de temperatura: Mantener a baja temperatura o congelar para retrasar la actividad biológica/enzimática, reacciones de degradación y volatilización.
- Protección lumínica y ambiental: Preservar de la humedad (evita hidrólisis) y conservar en la oscuridad (previene reacciones fotoquímicas).
- Selección del contenedor: Elegir recipientes químicamente inertes para evitar fenómenos de adsorción, difusión o reactividad con las paredes.
- Adición de estabilizantes y control del pH: Incorporar conservantes químicos o regular el pH para fijar las especies de interés.
- Cumplimiento del tiempo límite: Analizar la muestra dentro del periodo acotado por el Holding Time.
- Cadena de custodia: Disponer de un registro documentado ininterrumpido que garantice el control y la trazabilidad de la muestra desde la toma hasta el análisis`);

P("T11",9,`9. Exponga brevemente una estrategia de muestreo intuitivo.`,
`El muestreo intuitivo es una estrategia de muestreo no probabilístico.
- No todas las partes del lote tienen la misma probabilidad de ser seleccionadas, existiendo elementos con probabilidad nula de ser tomados.
- La elección de los puntos y muestras no responde a un criterio matemático o aleatorio, sino al juicio, experiencia previa y criterio personal del operador (o por motivos de conveniencia). Se emplea cuando no se busca o no es posible obtener una muestra representativa de todo el lote, sino focalizarse en áreas concretas`);

P("T11",10,`10. Exponga brevemente una estrategia de muestreo sistemático.`,
`El muestreo sistemático es una modalidad de muestreo probabilístico orientada a conseguir una muestra representativa del total del lote.
- Garantiza que todos los elementos constituyentes tengan una probabilidad definida de ser seleccionados.
- Consiste en recolectar las muestras o incrementos a intervalos regulares preestablecidos, los cuales pueden ser de naturaleza espacial (por ejemplo, siguiendo una cuadrícula fija o patrones regulares en zig-zag sobre un terreno) o temporal (tomando fracciones a intervalos fijos de tiempo en líneas de producción continua)`);

<script>
"use strict";
/* ===================== UTILIDADES ===================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTok = s => esc(s).replace(/_\{([^}]*)\}/g, '<sub>$1</sub>');
const DAY = 864e5, NOW = () => Date.now();
const INTERVAL_DAYS = [0, 1, 2, 4, 8, 16];
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
const pct = (a,b) => b ? Math.round(100*a/b) : 0;

/* ===================== ESTADO ===================== */
const LS_KEY = 'qc-imt-progress-v1';
function freshState(){ return {v:1, upd:0, fc:{}, gp:{}, sel:null, filt:'todo', shuffle:false, lvl:2, hl:true, voice:'', extra:[], extraTemas:[], sFc:null, sGp:null}; }
let S = freshState();
let view = 'home', viewArg = null;
let lsOK = false;

function normalize(o){
  const s = Object.assign(freshState(), o||{});
  if(typeof s.fc!=='object'||!s.fc) s.fc={}; if(typeof s.gp!=='object'||!s.gp) s.gp={};
  if(!Array.isArray(s.extra)) s.extra=[]; if(!Array.isArray(s.extraTemas)) s.extraTemas=[];
  if(![1,2,3].includes(s.lvl)) s.lvl=2; if(typeof s.hl!=='boolean') s.hl=true; if(!['todo','pend','fall'].includes(s.filt)) s.filt='todo';
  return s;
}
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); lsOK = true; if(raw) S = normalize(JSON.parse(raw)); }catch(e){ lsOK = false; }
}

/* ---- Banco de preguntas: originales congelados + importadas ---- */
let BANK = [], TEM = [], BYID = {};
function buildBank(){
  TEM = TEMAS.slice();
  for(const t of S.extraTemas) if(!TEM.find(x=>x.id===t.id)) TEM.push(t);
  BANK = PREGUNTAS.slice();
  const ids = new Set(BANK.map(q=>q.id));
  for(const q of S.extra) if(!ids.has(q.id)){ BANK.push(q); ids.add(q.id); }
  const order = Object.fromEntries(TEM.map((t,i)=>[t.id,i]));
  BANK.sort((a,b)=> (order[a.tema]??999)-(order[b.tema]??999) || a.n-b.n);
  BYID = Object.fromEntries(BANK.map(q=>[q.id,q]));
  if(!Array.isArray(S.sel)) S.sel = TEM.map(t=>t.id);
  S.sel = S.sel.filter(id=>TEM.find(t=>t.id===id));
}
const temaOf = id => TEM.find(t=>t.id===id);
const TCOL = {T1:'#4ea1ff',T2:'#2fc6b0',T3:'#b48cff',T4:'#ff7ab6',T5:'#56d3ff',T6:'#ff9550',T7:'#9fd654',T8:'#ff6b6b',T9:'#d8b48a',T10:'#8a95ff',T11:'#5fe3a1'};
const XCOL = ['#c9a0dc','#7fd1c7','#e0b0ff','#a3c4f3','#f4a6a6','#bde0a8'];
function tcol(id){ if(TCOL[id]) return TCOL[id]; const i = TEM.findIndex(t=>t.id===id); return XCOL[(i<0?0:i) % XCOL.length]; }
const tchip = id => `<span class="tchip" style="--tc:${tcol(id)}">${esc(id)}</span>`;
const shortTema = t => t.nombre.replace(/^TEMA\s*\d+\s*[–-]\s*/,'');

/* ===================== GUARDADO ===================== */
let cloud = null, cloudBusy = false, cloudDirty = false, saveTimer = null, cloudState = 'off';
function touch(){ S.upd = NOW(); saveLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 1200); }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); lsOK = true; }catch(e){ lsOK = false; } leds(); }
async function pushCloud(){
  if(!cloud) return;
  if(cloudBusy){ cloudDirty = true; return; }
  cloudBusy = true; cloudDirty = false; cloudState = 'sync'; leds();
  try{ await cloud.set({json: JSON.stringify(S), upd: S.upd}); cloudState = 'on'; }
  catch(e){ cloudState = 'err'; }
  cloudBusy = false; leds();
  if(cloudDirty) pushCloud();
}
function leds(){
  const l = $('#ledLocal'), c = $('#ledCloud'); if(!l) return;
  l.className = 'led' + (lsOK ? ' on' : ' warn');
  c.className = 'led' + (cloudState==='on' ? ' on' : (cloudState==='sync'||cloudState==='err') ? ' warn' : '');
  $('#saveStatus').title = 'Progreso guardado únicamente en este navegador. No hay sincronización en la nube.';
}
async function initCloud(){
  if(!window.claude || typeof window.claude.use!=='function') return false;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return true;
    const uid = await user.id(); if(!uid) return true;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    cloud = ref; cloudState = 'on';
    if(snap.exists){
      const d = snap.data();
      let remote = null; try{ remote = JSON.parse(d.json); }catch(e){}
      if(remote && (remote.upd||0) > (S.upd||0)){ S = normalize(remote); saveLocal(); buildBank(); render(); }
      else if((S.upd||0) > ((remote&&remote.upd)||0)) pushCloud();
    } else if(S.upd) pushCloud();
  }catch(e){ cloudState = 'err'; }
  leds(); return true;
}

/* ===================== TEXTO: PARSEO Y RENDER ===================== */
const STOP = new Set(('el la los las un una unos unas de del al a ante en y e o u que con por para sin se su sus es son lo le les como más mas pero si sí no ni ya muy entre sobre desde hasta cuando donde cual cuales cuál este esta estos estas ese esa esos esas eso esto también tanto otro otros otra otras cada todo toda todos todas puede pueden ser sea han ha hay tiene tienen dicho dicha dichos dichas mismo misma mismos así etc ej p. tras bajo según cuyo cuya fue era será están está estar hace hacer the and of for').split(' '));
const MARKER = /^(\d+\.-?|\d+\.-|[a-zA-Z]\)|[a-d]\.|-|o|•|·)$/;
const LEAD = /^[«“"'‘(\[¿¡]+/, TRAIL = /[.,:;!?»”"'’)\]]+$/;

function tokenize(text, ctr, cell){
  const out = []; const parts = text.split(/(\s+)/); let firstChunk = true;
  for(const p of parts){
    if(p==='') continue;
    if(/^\s+$/.test(p)){ out.push({t:' '}); continue; }
    if(p==='¶'){ out.push({br:true}); firstChunk=false; continue; }
    if(firstChunk && !cell && MARKER.test(p)){ out.push({t:p}); firstChunk=false; continue; }
    firstChunk = false;
    let lead = (p.match(LEAD)||[''])[0]; let rest = p.slice(lead.length);
    let trail = (rest.match(TRAIL)||[''])[0]; let core = rest.slice(0, rest.length-trail.length);
    if(!/[\p{L}\p{N}]/u.test(core)){ out.push({t:p}); continue; }
    if(lead) out.push({t:lead});
    out.push({w:true, t:core, i:ctr.n++, trail, cell:!!cell});
    if(trail) out.push({t:trail});
  }
  return out;
}
function parseText(str){
  const ctr = {n:0}; const blocks = []; let tbl = null;
  for(const raw of str.split('\n')){
    if(raw.startsWith('|')){
      const head = raw.startsWith('|!');
      const cells = raw.slice(head?2:1).split(' | ').map(c=>c.trim());
      if(!tbl){ tbl = {k:'tbl', rows:[]}; blocks.push(tbl); }
      const row = {head, cells: cells.map(c=>tokenize(c, ctr, true))};
      if(head) row.cells.forEach(c=>c.forEach(t=>{ if(t.w) t.hd=true; }));
      if(!head && row.cells.length===2){ const ws = row.cells[0].filter(t=>t.w); if(ws.length && ws.length<=4) ws.forEach(t=>t.lab=true); }
      tbl.rows.push(row);
      continue;
    }
    tbl = null;
    const m = raw.match(/^\[\[img:([\w-]+)\]\]$/);
    if(m){ blocks.push({k:'img', key:m[1]}); continue; }
    if(raw.trim()===''){ blocks.push({k:'blank'}); continue; }
    const ind = raw.match(/^ */)[0].length;
    const toks = tokenize(raw.trim(), ctr, false);
    const ws = toks.filter(t=>t.w); const ci = ws.findIndex(t=>/:/.test(t.trail||''));
    if(ci>=0 && ci<14) for(let j=0;j<=ci;j++) ws[j].lab = true;
    blocks.push({k:'ln', ind, toks});
  }
  return {blocks, nWords: ctr.n};
}
const parseCache = new Map();
function parsed(str){ if(!parseCache.has(str)) parseCache.set(str, parseText(str)); return parseCache.get(str); }

function renderToks(toks, g, em){
  let h = '';
  for(const k of toks){
    if(k.br){ h += '<br>'; continue; }
    if(!k.w){ h += fmtTok(k.t); continue; }
    if(g && g.chosen.has(k.i)){
      let cls = 'gap';
      if(g.revealed) cls += g.marks.get(k.i) ? ' ok' : ' ko';
      else if(g.peeked.has(k.i)) cls += ' peek';
      const lbl = g.revealed || g.peeked.has(k.i) ? esc(k.t) : 'hueco';
      h += `<button class="${cls}" data-act="gap" data-i="${k.i}" aria-label="${lbl}">${fmtTok(k.t)}</button>`;
    } else if(em && k.lab) h += `<b class="kl">${fmtTok(k.t)}</b>`;
    else if(em && em.has(k.i)) h += `<mark class="kw">${fmtTok(k.t)}</mark>`;
    else h += fmtTok(k.t);
  }
  return h;
}
function renderText(str, g, hl){
  const {blocks} = parsed(str); const em = hl ? emphKeys(str) : null; let h = '<div class="txt">';
  for(const b of blocks){
    if(b.k==='blank') h += '<div class="gapline"></div>';
    else if(b.k==='img'){ const src = IMGS[b.key]; h += src ? `<div class="fig"><img src="${src}" alt="Figura del documento original"></div>` : `<p class="ln">[Figura ${esc(b.key)} no disponible]</p>`; }
    else if(b.k==='tbl'){
      h += '<div class="tblw"><table class="tbl"><tbody>';
      for(const r of b.rows){ h += '<tr>' + r.cells.map(c=> r.head ? `<th>${renderToks(c,g,em)}</th>` : `<td>${renderToks(c,g,em)}</td>`).join('') + '</tr>'; }
      h += '</tbody></table></div>';
    } else {
      const pad = b.ind ? ` style="padding-left:${(b.ind/4*1.4).toFixed(2)}em"` : '';
      h += `<p class="ln"${pad}>${renderToks(b.toks, g, em)}</p>`;

/* ===================== AUDIO (síntesis de voz del navegador) ===================== */
const TTS = { ok: typeof window.speechSynthesis!=='undefined' && typeof window.SpeechSynthesisUtterance!=='undefined', id:null, rate:0.95, voice:null };
const RATES = [0.95, 1.15, 0.8];
function voiceScore(v){
  let s = 0; const n = v.name;
  if(/^es[-_]ES/i.test(v.lang)) s += 6; else if(/^es/i.test(v.lang)) s += 3; else return -99;
  if(/natural|neural|online/i.test(n)) s += 6;
  if(/premium|mejorad|enhanced|siri/i.test(n)) s += 5;
  if(/google/i.test(n)) s += 3;
  if(/m[oó]nica|elvira|[aá]lvaro|alvaro|paulina|jorge|marisol|lucia|lucía|dalia|helena|laura|pablo/i.test(n)) s += 1;
  if(/espeak|compact/i.test(n)) s -= 6;
  if(/grandma|grandpa|abuel|eddy|flo|reed|rocko|sandy|shelley|bells|bubbles|cellos|jester|organ|trinoids|whisper|zarvox|bad news|good news|superstar|boing/i.test(n)) s -= 8;
  return s;
}
function esVoices(){ try{ return speechSynthesis.getVoices().filter(v=>voiceScore(v)>-50).sort((a,b)=>voiceScore(b)-voiceScore(a)); }catch(e){ return []; } }
function pickVoice(){
  if(!TTS.ok) return;
  const vs = esVoices();
  TTS.voice = (S.voice && vs.find(v=>v.name===S.voice)) || vs[0] || null;
}
if(TTS.ok){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', ()=>{ pickVoice(); if(view==='home' && typeof render==='function' && document.getElementById('app')) render(); }); }catch(e){} }
function plainText(str){
  const out = [];
  const tx = toks => toks.map(t=> t.br ? '. ' : t.t.replace(/_\{([^}]*)\}/g,'$1')).join('');
  for(const b of parsed(str).blocks){
    if(b.k==='ln') out.push(tx(b.toks).replace(/^(-|•|·|o)\s+/, ''));
    else if(b.k==='tbl') b.rows.forEach(r=>out.push(r.cells.map(tx).filter(x=>x.trim()).join(', ')));
  }
  return out.map(l=>l.trim()).filter(Boolean).map(l=>/[.:;!?)]$/.test(l) ? l : l + '.');
}
function chunks(lines){
  const res = [];
  for(const l of lines){
    for(const sent of l.split(/(?<=[.;:])\s+/)){
      if(sent.length <= 200){ res.push(sent); continue; }
      let cur = ''; for(const part of sent.split(/(?<=,)\s+/)){ if((cur+' '+part).length > 200 && cur){ res.push(cur); cur = part; } else cur = cur ? cur+' '+part : part; } if(cur) res.push(cur);
    }
  }
  return res.filter(x=>/[\p{L}\p{N}]/u.test(x));
}
function stopSpeak(){ if(!TTS.ok) return; TTS.id = null; try{ speechSynthesis.cancel(); }catch(e){} syncSpeakBtns(); }
function speak(key, str){
  if(!TTS.ok) return;
  if(TTS.id === key){ stopSpeak(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  TTS.id = key; syncSpeakBtns();
  const parts = chunks(plainText(str));
  parts.forEach((txt, i)=>{
    const u = new SpeechSynthesisUtterance(txt);
    if(!TTS.voice) pickVoice();
    u.lang = TTS.voice ? TTS.voice.lang : 'es-ES'; if(TTS.voice) u.voice = TTS.voice; u.rate = TTS.rate; u.pitch = 1;
    if(i === parts.length-1){ u.onend = u.onerror = () => { if(TTS.id === key){ TTS.id = null; syncSpeakBtns(); } }; }
    speechSynthesis.speak(u);
  });
}
function syncSpeakBtns(){
  document.querySelectorAll('[data-act="speak"]').forEach(b=>{ const on = TTS.id === b.dataset.k; b.setAttribute('aria-pressed', on); b.innerHTML = on ? '■ Parar' : '▶ Escuchar'; });
}
function speakBtns(key){
  if(!TTS.ok) return `<span class="label" title="Tu navegador no ofrece lectura en voz alta">Audio no disponible</span>`;
  return `<span class="spk"><button class="hlbtn spkbtn" data-act="speak" data-k="${key}" aria-pressed="${TTS.id===key}">${TTS.id===key?'■ Parar':'▶ Escuchar'}</button><button class="hlbtn" data-act="rate-tts" aria-label="Velocidad de lectura">${TTS.rate}×</button></span>`;
}

/* ===================== GENERADOR DE HUECOS ===================== */
const LEVELS = {1:{frac:.14, cap:.18, name:'FÁCIL'}, 2:{frac:.28, cap:.32, name:'MEDIO'}, 3:{frac:.46, cap:.5, name:'DIFÍCIL'}};
function wordList(str){ const out=[]; for(const b of parsed(str).blocks){ if(b.k==='ln') b.toks.forEach(t=>t.w&&out.push(t)); else if(b.k==='tbl') b.rows.forEach(r=>r.cells.forEach(c=>c.forEach(t=>t.w&&out.push(t)))); } return out; }
function scoreWord(w){
  const t = w.t, low = t.toLowerCase();
  if(STOP.has(low)) return 0;
  const digit = /\p{N}/u.test(t);
  const acro = /^[\p{Lu}\p{N}\-\/.]{2,}$/u.test(t) && /\p{Lu}/u.test(t);
  if(t.length < 3 && !digit && !acro) return 0;
  if(t==='X' ) return 0;
  let s = 1;
  if(t.length >= 8) s += 1.2; else if(t.length >= 6) s += .6;
  if(digit) s += 2.5; if(acro) s += 1.4;
  if(/:/.test(w.trail||'')) s += 1;
  if(/^\p{Lu}/u.test(t)) s += .3;
  if(w.cell) s += .4;
  return s;
}
const emCache = new Map();
const EMSTOP = new Set('mediante través acuerdo según embargo además asimismo forma manera principal principales general generales importante siempre únicamente directamente necesario necesaria posible capacidad conjunto relación respecto parte partes tanto mayor menor misma mismos cualquier ningún través durante debido través otros todas través través entre'.split(' '));
function emphKeys(str){
  if(emCache.has(str)) return emCache.get(str);
  const words = wordList(str);
  const q = BANK.find(x=>x.a===str); const qWords = new Set(q ? wordList(q.q).map(w=>w.t.toLowerCase()) : []);
  const cands = words.filter(w=>!w.lab && !w.hd).map(w=>{
    const low = w.t.toLowerCase();
    if(/^(Verdadero|Falso)$/.test(w.t)) return {i:w.i, s:9, low};
    if(EMSTOP.has(low) || (w.t===low && /(ando|iendo|mente|ar|er|ir|ado|ada|ados|adas|ido|ida|idos|idas|an|en)$/.test(low))) return {i:w.i, s:0, low};
    let sc = scoreWord(w); if(qWords.has(low)) sc += 1;
    return {i:w.i, s:sc, low};
  }).filter(c=>c.s>=2.2).sort((a,b)=>b.s-a.s || a.i-b.i);
  const cap = Math.min(Math.round(words.length*.10)+2, 18), seen = {}, pick = [];
  for(const c of cands){ if(pick.length>=cap) break; seen[c.low]=(seen[c.low]||0)+1; if(seen[c.low]>2) continue; pick.push(c.i); }
  const set = new Set(pick);
  emCache.set(str, set); return set;
}
function makeGaps(str, lvl, seed){
  const words = wordList(str), W = words.length;
  const L = LEVELS[lvl];
  const cands = words.map(w=>({w, s:scoreWord(w)})).filter(c=>c.s>0);
  if(!cands.length) return new Set();
  let n = Math.max(1, Math.round(cands.length * L.frac));
  let cap = W < 12 ? Math.max(1, Math.floor(W*.3)) : Math.floor(W * L.cap);
  n = Math.min(n, Math.max(1,cap), cands.length);
  const r = rng(seed);
  const keyed = cands.map(c=>({i:c.w.i, k: Math.pow(r(), 1/c.s)})).sort((a,b)=>b.k-a.k);
  const chosen = new Set();
  for(const c of keyed){ if(chosen.size>=n) break; if(lvl<3 && (chosen.has(c.i-1)||chosen.has(c.i+1))) continue; chosen.add(c.i); }
  for(const c of keyed){ if(chosen.size>=n) break; chosen.add(c.i); }
  return chosen;
}

/* ===================== SELECCIÓN / COLAS ===================== */
const fcSt = id => S.fc[id] || (S.fc[id] = {box:0, due:0, seen:0, mal:0, reg:0, bien:0, last:null, t:0});
const gpSt = id => S.gp[id] || (S.gp[id] = {n:0, ok:0, tot:0, last:null, t:0});
const fcMastered = st => st && st.box >= 3 && st.last==='bien';
const gpMastered = st => st && st.n >= 2 && st.last >= .9;
function inSel(){ const s = new Set(S.sel); return BANK.filter(q=>s.has(q.tema)); }
function filterFor(mode, list, filt){
  const now = NOW();
  if(mode==='fc'){
    if(filt==='pend') return list.filter(q=>{ const s=S.fc[q.id]; return !s || !s.seen || s.due<=now || s.last!=='bien'; });
    if(filt==='fall') return list.filter(q=>{ const s=S.fc[q.id]; return s && (s.last==='mal'||s.last==='reg'); })
      .sort((a,b)=>{ const A=S.fc[a.id],B=S.fc[b.id]; return (A.last==='mal'?0:1)-(B.last==='mal'?0:1) || A.box-B.box; });
  } else {
    if(filt==='pend') return list.filter(q=>{ const s=S.gp[q.id]; return !s || !s.n || s.last < .9; });
    if(filt==='fall') return list.filter(q=>{ const s=S.gp[q.id]; return s && s.n && s.last < .75; }).sort((a,b)=>S.gp[a.id].last-S.gp[b.id].last);
  }
  return list;
}
function shuffle(a, seed){ const r=rng(seed); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQueue(mode, filt, ids){
  let list = ids ? ids.map(id=>BYID[id]).filter(Boolean) : filterFor(mode, inSel(), filt);
  let q = list.map(x=>x.id);
  if(S.shuffle && !(filt==='fall' && !ids)) q = shuffle(q, NOW());
  return q;
}

}
function rateFc(r){
  const s = S.sFc; const id = s.queue[s.pos]; if(!id) return;
  const st = fcSt(id), now = NOW();
  st.seen++; st[r]++; st.last = r; st.t = now;
  if(r==='mal'){ st.box = 0; st.due = now; }
  else if(r==='reg'){ st.box = Math.max(1, Math.min(st.box, 2)); st.due = now + DAY/2; }
  else { st.box = Math.min(5, st.box + 1); st.due = now + INTERVAL_DAYS[st.box]*DAY; }
  s.rated[s.pos] = r; s.sum[r]++;
  const rc = s.re[id]||0;
  if(r==='mal' && rc<3){ s.queue.splice(Math.min(s.pos+4, s.queue.length), 0, id); s.re[id]=rc+1; }
  else if(r==='reg' && rc<2){ s.queue.splice(Math.min(s.pos+8, s.queue.length), 0, id); s.re[id]=rc+1; }
  s.pos++; s.show = false; touch(); render(); scrollTop();
}
