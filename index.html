/* ===================== RELLENAR HUECOS ===================== */
let G = null; // estado visual temporal de la tarjeta (nunca toca el texto original)
function startGp(filt, ids){
  S.sGp = {queue: buildQueue('gp', filt, ids), pos:0, filt: ids?'manual':filt, sum:{ok:0,tot:0,n:0}};
  G = null; touch(); go('gp');
}
function ensureG(){
  const s = S.sGp; const id = s.queue[s.pos];
  if(!G || G.id!==id || G.lvl!==S.lvl){
    const seed = (NOW() ^ (s.pos*7919)) >>> 0;
    G = {id, lvl:S.lvl, seed, chosen: makeGaps(BYID[id].a, S.lvl, seed), peeked:new Set(), revealed:false, marks:new Map()};
  }
  return G;
}
function regenGaps(){ if(!G) return; G.seed = (G.seed*1103515245 + 12345 + NOW()) >>> 0; G.chosen = makeGaps(BYID[G.id].a, G.lvl, G.seed); G.peeked = new Set(); G.revealed = false; G.marks = new Map(); render(); }
function revealGp(){ G.revealed = true; for(const i of G.chosen) G.marks.set(i, !G.peeked.has(i)); render(); }
function nextGp(record){
  const s = S.sGp;
  if(record && G && G.revealed && G.chosen.size){
    const ok = [...G.marks.values()].filter(Boolean).length, tot = G.chosen.size;
    const st = gpSt(G.id); st.n++; st.ok += ok; st.tot += tot; st.last = ok/tot; st.t = NOW(); st.lvl = G.lvl;
    s.sum.ok += ok; s.sum.tot += tot; s.sum.n++;

  s.pos++; G = null; touch(); render(); scrollTop();
}

function gpDone(){
  const s = S.sGp;
  const weak = [...new Set(s.queue)].filter(id=>S.gp[id] && S.gp[id].last < .75);
  return screenBar('Rellenar huecos','MODO 2') + `<div class="panel"><h3>Sesión completada</h3>
  <div class="kpis"><div class="kpi"><div class="v">${s.sum.n}</div><div class="k">Respuestas</div></div><div class="kpi"><div class="v">${s.sum.tot}</div><div class="k">Huecos</div></div><div class="kpi good"><div class="v">${s.sum.ok}</div><div class="k">Recordados</div></div><div class="kpi"><div class="v">${pct(s.sum.ok,s.sum.tot)}%</div><div class="k">Acierto</div></div></div>
  <div class="controls">${weak.length?`<button class="btn y big" data-act="gpRetry" data-ids="${weak.join(',')}">Repetir las ${weak.length} con menos del 75%</button>`:''}

}

/* ===================== PANTALLAS COMUNES ===================== */
function screenBar(title, tag){ return `<div class="bar"><button class="btn sm ghost" data-act="home" aria-label="Inicio">◀ Inicio</button><h2>${esc(title)}</h2><span class="tag">${tag}</span></div>`; }
function progBar(pos, n){ return `<div class="prog"><div class="gauge"><i class="y" style="width:${pct(pos,n)}%"></i></div><span class="n">${Math.min(pos+1,n)} / ${n}</span></div>`; }
function fcAgg(list){ const a={n:list.length,seen:0,mal:0,reg:0,bien:0,dom:0}; for(const q of list){ const s=S.fc[q.id]; if(s&&s.seen){ a.seen++; a[s.last]++; if(fcMastered(s)) a.dom++; } } return a; }
function gpAgg(list){ const a={n:list.length,prac:0,sum:0,dom:0}; for(const q of list){ const s=S.gp[q.id]; if(s&&s.n){ a.prac++; a.sum+=s.last; if(gpMastered(s)) a.dom++; } } a.avg = a.prac ? a.sum/a.prac : 0; return a; }
function fcGauge(a){ return `<div class="gauge" title="Bien / Regular / Mal / sin ver"><i class="g" style="width:${pct(a.bien,a.n)}%"></i><i class="m" style="width:${pct(a.reg,a.n)}%"></i><i class="b" style="width:${pct(a.mal,a.n)}%"></i></div>`; }
function gpGauge(a){ return `<div class="gauge"><i class="y" style="width:${pct(a.prac,a.n)}%"></i></div>`; }

/* ===================== IMPORT / EXPORT ===================== */
function doImportTemario(text){
  let data; try{ data = JSON.parse(text); }catch(e){ return ['El texto no es JSON válido. Revisa comillas y comas.', true]; }
  let temas = [], preg = [];
  if(Array.isArray(data)) preg = data; else if(data && Array.isArray(data.preguntas)){ preg = data.preguntas; temas = Array.isArray(data.temas)?data.temas:[]; }
  else return ['Formato no reconocido: usa una lista de preguntas o {"temas":[…],"preguntas":[…]}.', true];
  let added = 0, dup = 0, bad = 0;
  for(const t of temas){ if(t && typeof t.id==='string' && typeof t.nombre==='string' && !TEM.find(x=>x.id===t.id) && !S.extraTemas.find(x=>x.id===t.id)) S.extraTemas.push({id:t.id, nombre:t.nombre}); }
  const ids = new Set(BANK.map(q=>q.id));
  for(const p of preg){
    if(!p || typeof p.tema!=='string' || typeof p.q!=='string' || typeof p.a!=='string' || !Number.isFinite(+p.n)){ bad++; continue; }
    const id = p.tema + '-' + (+p.n);
    if(ids.has(id)){ dup++; continue; }
    if(!TEM.find(x=>x.id===p.tema) && !S.extraTemas.find(x=>x.id===p.tema)) S.extraTemas.push({id:p.tema, nombre:p.tema});
    const q = {id, tema:p.tema, n:+p.n, q:p.q, a:p.a}; if(typeof p.nota==='string') q.nota = p.nota;
    S.extra.push(q); ids.add(id); added++;
  }
  buildBank(); touch();
  return [`Añadidas ${added}. Ya existían ${dup} (no duplicadas).${bad?` ${bad} con formato incorrecto ignoradas.`:''}`, added===0 && bad>0];
}
function doImportProgress(text){
  let d; try{ d = JSON.parse(text); }catch(e){ return ['El texto no es JSON válido.', true]; }
  const p = d && d.app==='qc-imt' ? d.progress : null;
  if(!p || typeof p!=='object' || typeof p.fc!=='object') return ['No parece una copia de este entrenador.', true];
  S = normalize(p); S.upd = NOW(); buildBank(); saveLocal(); pushCloud();
  return [`Progreso importado: ${Object.keys(S.fc).length} preguntas con historial de flashcards y ${Object.keys(S.gp).length} de huecos.`, false];
}
function makeExport(){ return JSON.stringify({app:'qc-imt', v:1, exportado:new Date().toISOString(), progress:S}); }

function go(v){ view = v; tempMsg = {}; exportTxt = exportTxt && v==='save' ? exportTxt : ''; confirmWipe = false; render(); scrollTop(); }

function currentKey(){
  if(view==='fc' && S.sFc && S.sFc.pos < S.sFc.queue.length) return 'fc:' + S.sFc.queue[S.sFc.pos];
  if(view==='gp' && S.sGp && S.sGp.pos < S.sGp.queue.length) return 'gp:' + S.sGp.queue[S.sGp.pos];

function readFileInto(input, ta){ const f = input.files && input.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { const t = $(ta); if(t) t.value = r.result; }; r.readAsText(f); }

document.addEventListener('change', e=>{
  if(e.target.id==='shuf'){ S.shuffle = e.target.checked; touch(); }
  if(e.target.id==='voiceSel'){ S.voice = e.target.value; pickVoice(); touch(); }
  if(e.target.id==='impTemFile') readFileInto(e.target, '#impTem');
  if(e.target.id==='impProgFile') readFileInto(e.target, '#impProg');
});
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  switch(a){
    case 'home': go('home'); break;
    case 'go': go(b.dataset.v); break;
    case 'tog': { const t=b.dataset.t; S.sel = S.sel.includes(t) ? S.sel.filter(x=>x!==t) : TEM.map(x=>x.id).filter(x=>x===t||S.sel.includes(x)); touch(); render(); break; }
    case 'selAll': S.sel = TEM.map(t=>t.id); touch(); render(); break;
    case 'selNone': S.sel = []; touch(); render(); break;
    case 'filt': S.filt = b.dataset.f; touch(); render(); break;
    case 'shuf': break;
    case 'startFc': startFc(S.filt); break;
    case 'startGp': startGp(S.filt); break;
    case 'testVoice': { if(TTS.id==='test'){ stopSpeak(); break; } TTS.id = null; speak('test', 'Control de calidad. La trazabilidad de un resultado analítico es la propiedad que implica su relación inequívoca con estándares o materiales de referencia apropiados.'); break; }
    case 'speak': { const k = b.dataset.k; const id = k.slice(3); if(BYID[id]) speak(k, BYID[id].a); break; }
    case 'rate-tts': { TTS.rate = RATES[(RATES.indexOf(TTS.rate)+1) % RATES.length]; const k = TTS.id; if(k){ TTS.id = null; speak(k, BYID[k.slice(3)].a); } render(); break; }
    case 'hl': S.hl = !S.hl; touch(); render(); break;
    case 'fcShow': S.sFc.show = true; render(); break;
    case 'rate': rateFc(b.dataset.r); break;
    case 'fcPrev': S.sFc.pos = Math.max(0, S.sFc.pos-1); S.sFc.show = false; touch(); render(); scrollTop(); break;
    case 'fcNext': S.sFc.pos++; S.sFc.show = false; touch(); render(); scrollTop(); break;
    case 'fcRepeat': { const s=S.sFc; s.queue.push(s.queue[s.pos]); touch(); b.textContent='✓ Añadida al final'; break; }
    case 'fcRestart': startFc(S.sFc && S.sFc.filt!=='manual' ? S.sFc.filt : S.filt); break;
    case 'fcRetry': case 'weakFc': startFc('manual', b.dataset.ids.split(',')); break;
    case 'fcOne': startFc('manual', [b.dataset.id]); break;
    case 'weakGp': case 'gpRetry': startGp('manual', b.dataset.ids.split(',')); break;
    case 'lvl': S.lvl = +b.dataset.l; touch(); G = null; render(); break;
    case 'gap': { if(!G) break; const i = +b.dataset.i; if(G.revealed) G.marks.set(i, !G.marks.get(i)); else G.peeked.add(i); render(); break; }
    case 'gpReveal': revealGp(); break;
    case 'gpNext': nextGp(true); break;
    case 'gpSkip': nextGp(false); break;
    case 'gpPrev': S.sGp.pos = Math.max(0, S.sGp.pos-1); G = null; touch(); render(); scrollTop(); break;
    case 'gpRegen': regenGaps(); break;
    case 'gpRestart': startGp(S.sGp && S.sGp.filt!=='manual' ? S.sGp.filt : S.filt); break;
    case 'checkN': { const v = $('#expN').value.trim(); const n = +v; tempMsg.exp = v;
      if(!v || !Number.isFinite(n)){ tempMsg.check = 'Escribe un número.'; tempMsg.checkErr = true; }
      else if(n===BANK.length){ tempMsg.check = `Coinciden: ${n} en tu documento y ${BANK.length} importadas.`; tempMsg.checkErr = false; }
      else { tempMsg.check = `No coinciden: ${n} en tu documento y ${BANK.length} importadas. Compara el recuento por tema de arriba.`; tempMsg.checkErr = true; }
      render(); break; }
    case 'impTem': { const [m, err] = doImportTemario($('#impTem').value); tempMsg.tem = m; tempMsg.temErr = err; render(); break; }
    case 'clearExtra': S.extra = []; S.extraTemas = []; buildBank(); touch(); tempMsg.tem = 'Preguntas importadas eliminadas. El temario original sigue intacto.'; tempMsg.temErr=false; render(); break;
    case 'exp': exportTxt = makeExport(); tempMsg.exp2 = ''; render(); break;
    case 'expCopy': { try{ await navigator.clipboard.writeText(exportTxt); tempMsg.exp2 = 'Copiado al portapapeles.'; tempMsg.exp2Err=false; }catch(err){ tempMsg.exp2 = 'No se pudo copiar automáticamente: selecciona el texto y cópialo.'; tempMsg.exp2Err=true; } render(); const t=$('#expTxt'); if(t && tempMsg.exp2Err){ t.focus(); t.select(); } break; }
    case 'expDl': {
      try { const blob = new Blob([exportTxt], {type:'application/json;charset=utf-8'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=`qc-progreso-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); tempMsg.exp2='Archivo de progreso descargado.'; tempMsg.exp2Err=false; } catch(err) { tempMsg.exp2='No se pudo descargar: usa Copiar.'; tempMsg.exp2Err=true; }
      render(); break; }
    case 'impProg': { const [m, err] = doImportProgress($('#impProg').value); tempMsg.prog = m; tempMsg.progErr = err; render(); break; }
    case 'wipe': confirmWipe = true; render(); break;
    case 'wipeNo': confirmWipe = false; render(); break;
    case 'wipeYes': { const keep = {sel:S.sel, filt:S.filt, lvl:S.lvl, shuffle:S.shuffle, extra:S.extra, extraTemas:S.extraTemas}; S = Object.assign(freshState(), keep); confirmWipe = false; touch(); tempMsg.prog = 'Historial borrado.'; render(); break; }
  }
});

/* ===================== ARRANQUE ===================== */
loadLocal(); buildBank(); render(); leds();

</script>
